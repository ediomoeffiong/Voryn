services:
  # Backend Web Service
  - type: web
    name: voryn-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build --workspace backend
    startCommand: npm run start --workspace backend
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # User will provide their MongoDB connection string
      - key: CORS_ORIGIN
        value: "*" # Or the frontend URL once deployed
      - key: NODE_ENV
        value: production

  # Frontend Static Site
  - type: web
    name: voryn-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build --workspace frontend
    publishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://voryn-backend.onrender.com
    headers:
      - path: /*
        headers:
          - key: Cache-Control
            value: public, max-age=0, must-revalidate
    routes:
      - src: /*
        dest: /index.html
