services:
  # Backend Web Service
  - type: web
    name: voryn-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build --workspace backend
    startCommand: npm run start --workspace backend
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # User will provide their MongoDB connection string
      - key: CORS_ORIGIN
        sync: false # Exact deployed frontend origin; wildcard is rejected in production
      - key: FRONTEND_URL
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
      - key: SESSION_TTL_HOURS
        value: 168
      - key: NODE_ENV
        value: production

  # Frontend Static Site
  - type: web
    name: voryn-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build --workspace frontend
    publishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://voryn-backend.onrender.com
    headers:
      - path: /*
        headers:
          - key: Cache-Control
            value: public, max-age=0, must-revalidate
    routes:
      - src: /*
        dest: /index.html
